<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midas - Abrindo Instagram</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 70px 20px;
      background: #111;
      color: white;
    }

    button {
      padding: 16px 25px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>Abrindo Instagram...</h2>
  <p>Se o aplicativo não abrir automaticamente:</p>

  <button onclick="abrirInstagram()">
    Abrir Instagram
  </button>

  <script>
    const usuario = "bruno_grecillo";

    const instagramApp =
      "instagram://user?username=" + usuario;

    const instagramWeb =
      "https://www.instagram.com/bruno_grecillo/";

    function abrirInstagram() {
      window.location.href = instagramApp;

      setTimeout(function () {
        window.location.href = instagramWeb;
      }, 2000);
    }

    window.addEventListener("load", function () {
      setTimeout(abrirInstagram, 500);
    });
  </script>

</body>
</html>
